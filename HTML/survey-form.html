<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Survey Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #1f2937;
    color: #f3f4f6;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
  }
  #survey-form {
    background: #111827;
    max-width: 600px;
    width: 100%;
    padding: 30px;
    border-radius: 10px;
  }
  #title { text-align: center; margin-bottom: 8px; }
  #description { text-align: center; color: #9ca3af; margin-bottom: 25px; }
  .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
  label { margin-bottom: 6px; font-weight: 600; }
  input[type="text"], input[type="email"], input[type="number"], select, textarea {
    padding: 10px;
    border-radius: 5px;
    border: none;
    font-size: 1rem;
  }
  .radio-group label, .checkbox-group label {
    display: flex;
    align-items: center;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .radio-group input, .checkbox-group input { margin-right: 10px; }
  textarea { resize: vertical; min-height: 80px; }
  #submit {
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: #fff;
    font-size: 1.1rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
  }
  #submit:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <form id="survey-form">
    <h1 id="title">Developer Survey</h1>
    <p id="description">Thanks for taking the time to help us improve!</p>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label for="number">Age</label>
      <input type="number" id="number" name="age" placeholder="Enter your age" min="10" max="100">
    </div>

    <div class="form-group">
      <label for="dropdown">Which best describes your role?</label>
      <select id="dropdown" name="role">
        <option value="student">Student</option>
        <option value="frontend">Frontend Developer</option>
        <option value="backend">Backend Developer</option>
        <option value="fullstack">Full Stack Developer</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="form-group radio-group">
      <p>How did you hear about freeCodeCamp?</p>
      <label><input type="radio" name="referral" value="search"> Search Engine</label>
      <label><input type="radio" name="referral" value="friend"> Friend</label>
      <label><input type="radio" name="referral" value="social"> Social Media</label>
    </div>

    <div class="form-group checkbox-group">
      <p>What would you like to see improved?</p>
      <label><input type="checkbox" name="improve" value="content"> Content</label>
      <label><input type="checkbox" name="improve" value="ui"> UI/UX</label>
      <label><input type="checkbox" name="improve" value="projects"> More Projects</label>
    </div>

    <div class="form-group">
      <label for="comments">Any comments or suggestions?</label>
      <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>
    </div>

    <button type="submit" id="submit">Submit</button>
  </form>
</body>
</html>
